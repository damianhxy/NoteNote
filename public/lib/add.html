<!DOCTYPE HTML>
<html>
<head>
	<meta charset="utf-8">
	<title>notenote</title>
	<link href="css/index.css" rel="stylesheet">
	<link href="css/sidebar.css" rel="stylesheet">
	<link href="css/font-awesome.min.css" rel="stylesheet">
	<link href="css/lemonade.min.css" rel="stylesheet">
	<script src="js/sidebar.js"></script>
	<link href='http://fonts.googleapis.com/css?family=Montserrat|Open+Sans:400,700' rel='stylesheet' type='text/css'>
</head>
<body>
	<nav id="sidebar-left">
		<div class="logo">
			<i class="fa fa-pencil fa-2x"></i>
			<h1>notenote</h1>
			<p>- share knowledge -</p>
		</div>
		<a href="#"><i class="fa fa-home"></i> Home</a>
		<a href="#"><i class="fa fa-star"></i> Highest Rated</a>
		<a href="#"><i class="fa fa-trophy"></i> Leaderboards	</a>
		<a href="#"><i class="fa fa-user"></i> My Profile</a>
		<a href="#"><i class="fa fa-plus"></i> Upload Notes</a>
		<a href="#"><i class="fa fa-sign-out"></i> Sign Out</a>
	</nav>
	<section class="cardbox">
		<div class="card add">
			<form class="dropzone">
				<p class="addtitle"><i class="fa fa-plus"></i> Upload Notes</p>
				<textarea class="addtext" placeholder="What're these notes about?"></textarea>
				<input type="file" class="addfile" id="af">
				<a href="#" id="fakeaf" class="addbutton">Upload File...</a><span class="addfilename">Your file name will appear here</span>
				<input type="text" class="addtext" placeholder="Tag your notes (comma separated)">
				<input type="submit" class="addbutton">
			</form>
		</div>
	</section>
	<div id="branding"><i class="fa fa-bars"></i></div>
</body>
</html>
