<!DOCTYPE HTML>
<html>
<head>
	<meta charset="utf-8">
	<title>notenote</title>
	<link href="css/index.css" rel="stylesheet">
	<link href="css/sidebar.css" rel="stylesheet">
	<link href="css/font-awesome.min.css" rel="stylesheet">
	<link href="css/lemonade.min.css" rel="stylesheet">
	<script src="js/sidebar.js"></script>
	<link href='http://fonts.googleapis.com/css?family=Montserrat|Open+Sans:400,700' rel='stylesheet' type='text/css'>
</head>
<body>
	<nav id="sidebar-left">
		<div class="logo">
			<i class="fa fa-pencil fa-2x"></i>
			<h1>notenote</h1>
			<p>- share knowledge -</p>
		</div>
		<a href="#"><i class="fa fa-home"></i> Home</a>
		<a href="#"><i class="fa fa-trophy"></i> Highest Rated</a>
		<a href="#"><i class="fa fa-user"></i> My Profile</a>
		<a href="#"><i class="fa fa-plus"></i> Upload Notes</a>
	</nav>
	<section class="cardbox">
		<div class="card searchbar"><i class="fa fa-search"></i><input type="text" placeholder="Search for notes..."><a href="#"><i class="fa fa-arrow-right"></i></a></div>
		<div class="cardcont">
			<div class="card">
				<div class="cardpic"></div>
				<p class="cardname">Username</p>
				<p class="cardcaption">These are my notes for purple</p>
				<a class="cardpreview pdf" href="#">
					<i class="fa fa-file-pdf-o"></i>
					<span> Amazing English Notes.pdf</span>
				</a>
				<div class="cardtags">
					<span>Tags: </span>
					<a>Blue</a>
					<a>Purple</a>
					<a>What</a>
					<a>Even</a>
				</div>
				<div class="cardcontrols">
					<span href="">1023</span>
					<a href=""><i class="fa fa-arrow-up"></i></a>
					<a href=""><i class="fa fa-arrow-down"></i></a>
					<a href=""><i class="fa fa-comment"></i></a>
				</div>
			</div>
		</div>
		<div class="card load"><i class="fa fa-spinner"></i> Load More Submissions</div>
	</section>
	<div id="branding"><i class="fa fa-bars"></i></div>
</body>
</html>
